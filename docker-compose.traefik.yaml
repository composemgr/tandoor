name: tandoor
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  tandoor:
    image: vabene1111/recipes:latest
    container_name: tandoor-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      SECRET_KEY: ${APP_SECRET_KEY:-replace-with-a-random-secret-key}
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: tandoor-db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-tandoor}
      POSTGRES_USER: ${DB_USER_NAME:-tandoor}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      ALLOWED_HOSTS: ${BASE_HOST_NAME:-*}
      CONTAINER_NAME: tandoor-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/data/tandoor/staticfiles:/opt/recipes/staticfiles'
      - './volumes/data/tandoor/mediafiles:/opt/recipes/mediafiles'
    depends_on:
      tandoor-db:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.tandoor-app.entrypoints=http'
      - 'traefik.http.routers.tandoor-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.tandoor-app.middlewares=tandoor-app-https-redirect'
      - 'traefik.http.middlewares.tandoor-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.tandoor-app-secure.entrypoints=https'
      - 'traefik.http.routers.tandoor-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.tandoor-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.tandoor-app-secure.service=tandoor-app'
      - 'traefik.http.services.tandoor-app.loadbalancer.server.port=80'
    networks:
      - tandoor
      - traefik
  tandoor-db:
    image: postgres:15-alpine
    container_name: tandoor-db
    hostname: tandoor-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-tandoor}
      POSTGRES_USER: ${DB_USER_NAME:-tandoor}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      CONTAINER_NAME: tandoor-db
    volumes:
      - './volumes/db/postgres/tandoor:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER_NAME:-tandoor}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tandoor

networks:
  tandoor:
    name: tandoor
    external: false
  traefik:
    external: true
