# nginx proxy address - http://172.17.0.1:8084

name: tandoor
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  tandoor:
    image: vabene1111/recipes:latest
    pull_policy: always
    container_name: tandoor-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - tandoor
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8084:8080"
    environment:
      TZ: ${TZ:-America/New_York}
      SECRET_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: tandoor-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-tandoor}
      POSTGRES_USER: ${DB_USER_NAME:-tandoor}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      ALLOWED_HOSTS: ${BASE_HOST_NAME:-*}
      GUNICORN_MEDIA: 0
      CONTAINER_NAME: tandoor-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - ./volumes/data/tandoor/staticfiles:/opt/recipes/staticfiles
      - ./volumes/data/tandoor/mediafiles:/opt/recipes/mediafiles
    depends_on:
      - tandoor-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://tandoor-app:8080'
      - 'cloudflare.hostname=tandoor.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.tandoor-app.entrypoints=http'
      - 'traefik.http.routers.tandoor-app-secure.tls=true'
      - 'traefik.http.routers.tandoor-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.tandoor-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.tandoor-app.middlewares=tandoor-app-https-redirect'
      - 'traefik.http.routers.tandoor-app-secure.entrypoints=https'
      - 'traefik.http.routers.tandoor-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.tandoor-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.tandoor-app-secure.service=tandoor-app'
      - 'traefik.http.services.tandoor-app.loadbalancer.server.port=8080'

  tandoor-db:
    image: postgres:latest
    pull_policy: always
    container_name: tandoor-db
    restart: always
    logging: *default-logging
    networks:
      - tandoor
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-tandoor}
      POSTGRES_USER: ${DB_USER_NAME:-tandoor}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      CONTAINER_NAME: tandoor-db
    volumes:
      - ./volumes/data/db/postgres/tandoor:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  tandoor:
    name: tandoor
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
